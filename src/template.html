<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="contentGrid">
      <header class="header">
        <input
          class="searchBar"
          id="searchCity"
          name="searchCity"
          type="text"
          placeholder="Enter City"
        />
        <button class="submitBtn" type="button">🔍</button>
      </header>
      <div class="weatherDisplay">
        <div class="current">
          <div class="currWeatherInfo">
            <div class="currDate">
              <div class="currDateText">Pune 6th December, 2026</div>
            </div>
            <div class="currConditionTable">
              <div class="tableHeader">
                <div class="tableHeaderText">Current Conditions</div>
              </div>
              <div class="currConditionsTableBodyCont">
                <div class="currConditionsTableBody">
                  <div class="visibilityBox">
                    <div class="visibilityHead heading">Visibility</div>
                    <div class="visibilityBody body">10 km</div>
                  </div>
                  <div class="Humidity">
                    <div class="humidityHead heading">Humidity</div>
                    <div class="humidityBody body">62%</div>
                  </div>
                  <div class="UVBox">
                    <div class="uvHead heading">UV Index</div>
                    <div class="uvBody body">6 High</div>
                  </div>
                  <div class="maxTempBox">
                    <div class="maxTempHead heading">Max Temp</div>
                    <div class="maxTempBody body">32°C</div>
                  </div>
                  <div class="minTempBox">
                    <div class="minTempHead heading">Min Temp</div>
                    <div class="minTempBody body">21°C</div>
                  </div>
                  <div class="precipProbBox">
                    <div class="precipProbHead heading">Precipitation Probability</div>
                    <div class="precipProbBody body">30%</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="currWeatherDesign">
            <div class="currWeatherIconCont">
              <img
                class="currWeatherIcons snow"
                src="./weatherIcons/dynamicIcons/snow.svg"
                alt="Dynamic Snow Icon"
              />
            </div>
            <div class="currWeatherText">
              <div class="currWeatherCond">Clear</div>
              <div class="currTemp">30 °C</div>
            </div>
          </div>
        </div>
        <div class="sevenDaysCast"></div>
      </div>
    </div>
  </body>
</html>
