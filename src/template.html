<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="contentGrid">
      <header class="header">
        <div class="searchBox">
          <input
            class="searchBar"
            id="searchCity"
            name="searchCity"
            type="text"
            placeholder="Enter City"
          />
          <button class="submitBtn" type="button">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" />
            </svg>
          </button>
        </div>
      </header>
      <div class="weatherDisplay">
        <div class="current">
          <div class="currWeatherInfo">
            <div class="currDate">
              <div class="currDateText">Enter a City to get Weather Info</div>
            </div>
            <div class="currConditionTable">
              <div class="tableHeader">
                <div class="tableHeaderText">Current Conditions</div>
              </div>
              <div class="currConditionsTableBodyCont">
                <div class="currConditionsTableBody">
                  <div class="visibilityBox">
                    <div class="visibilityHead heading">Visibility</div>
                    <div class="visibilityBody body">--</div>
                  </div>
                  <div class="Humidity">
                    <div class="humidityHead heading">Humidity</div>
                    <div class="humidityBody body">--</div>
                  </div>
                  <div class="UVBox">
                    <div class="uvHead heading">UV Index</div>
                    <div class="uvBody body">--</div>
                  </div>
                  <div class="maxTempBox">
                    <div class="maxTempHead heading">Max Temp</div>
                    <div class="maxTempBody body">--</div>
                  </div>
                  <div class="minTempBox">
                    <div class="minTempHead heading">Min Temp</div>
                    <div class="minTempBody body">--</div>
                  </div>
                  <div class="precipProbBox">
                    <div class="precipProbHead heading">Precipitation Probability</div>
                    <div class="precipProbBody body">--</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="currWeatherDesign">
            <div class="currWeatherIconCont">
              <img
                class="currWeatherIcons empty"
                src="./weatherIcons/dynamicIcons/snow.svg"
                alt="No weather loaded yet"
              />
            </div>
            <div class="currWeatherText">
              <div class="currWeatherCond">--</div>
              <div class="currTemp">--</div>
            </div>
          </div>
        </div>
        <div class="sevenDaysCast">
          <div class="sevenDaysHeading">7 days Forecast</div>
          <div class="sevenDaysForecastTable">
            <div class="day1 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/clear.svg"
                  alt="clear-day-static"
                />
              </div>
              <div class="temp sevenDays">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day2 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/cloudy.svg"
                  alt="cloudy-day-static"
                />
              </div>
              <div class="temp sevenDays">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day3 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/fog.svg"
                  alt="fog-day-static"
                />
              </div>
              <div class="temp sevenDays">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day4 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/partially-cloudy.svg"
                  alt="partly-cloudy-day-static"
                />
              </div>
              <div class="temp sevenDays dayBox">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day5 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/rain.svg"
                  alt="rain-day-static"
                />
              </div>
              <div class="temp sevenDays dayBox">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day6 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/snow.svg"
                  alt="snow-day-static"
                />
              </div>
              <div class="temp sevenDays">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
            <div class="day7 sevenDays dayBox">
              <div class="dayName sevenDays">--</div>
              <div class="iconCont sevenDays">
                <img
                  class="icon sevenDays"
                  src="./weatherIcons/staticIcons/wind.svg"
                  alt="wind-day-static"
                />
              </div>
              <div class="temp sevenDays">
                <div class="maxTemp sevenDays">--</div>
                <div class="minTemp sevenDays">--</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
