<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <body>
      <div class="contentGrid">
        <header class="header">
          <input
            class="searchBar"
            id="searchCity"
            name="searchCity"
            type="text"
            placeholder="Enter City"
          />
          <button class="submitBtn" type="button">🔍</button>
        </header>
        <div class="weatherDisplay">
          <div class="current">
            <div class="currWeatherInfo">
              <div class="currDate">
                <div class="currDateText">Pune 6th December, 2026</div>
              </div>
              <div class="currConditions"></div>
            </div>
            <div class="currWeatherDesign">
              <img class="currWeatherIcons" src="./weatherIcons/dynamicIcons/clear-day.svg" />
              <div class="currTime"></div>
            </div>
          </div>
          <div class="7daysCast"></div>
        </div>
      </div>
    </body>
  </body>
</html>
