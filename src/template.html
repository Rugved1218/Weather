<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <body>
      <div class="contentGrid">
        <header class="header">
          <input
            class="searchBar"
            id="searchCity"

            type="text"

        </header>
        <div class="weatherDisplay">
          <div class="current"></div>
          <div class="7daysCast"></div>
        </div>
      </div>
    </body>
  </body>
</html>
