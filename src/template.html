<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="contentGrid">
      <header class="header">
        <input
          class="searchBar"
          id="searchCity"
          name="searchCity"
          type="text"
          placeholder="Enter City"
        />
        <button class="submitBtn" type="button">🔍</button>
      </header>
      <div class="weatherDisplay">
        <div class="current">
          <div class="currWeatherInfo">
            <div class="currDate">
              <div class="currDateText">Pune 6th December, 2026</div>
            </div>
            <div class="currConditionTable">
              <div class="tableHeader">
                <div class="tableHeaderText">Current Conditions</div>
              </div>
              <div class="currConditionsTableBodyCont">
                <div class="currConditionsTableBody">
                  <div class="visiblityBox">
                    <div class="visiblityHead heading">Visiblity</div>
                    <div class="visiblityBody body">10 km</div>
                  </div>
                  <div class="Humidity">
                    <div class="humidityHead heading">Humidity</div>
                    <div class="humidityBody body">62%</div>
                  </div>
                  <div class="UVBox">
                    <div class="uvHead heading">UV Index</div>
                    <div class="uvBody body">6 High</div>
                  </div>
                  <div class="tempRangeBox">
                    <div class="tempRangeHead heading">High/Low</div>
                    <div class="tempRangeBody body">32°C / 21°C</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="currWeatherDesign">
            <div class="currWeatherIconCont">
              <img class="currWeatherIcons" src="./weatherIcons/dynamicIcons/clear-day.svg" />
            </div>
            <div class="currWeatherText">
              <div class="currWeatherCond">Clear</div>
              <div class="currTemp">30 °C</div>
            </div>
          </div>
        </div>
        <div class="7daysCast"></div>
      </div>
    </div>
  </body>
</html>
